# Tracing LangSmith (tat mac dinh): bien lay tu .env cua thu muc nay; gan cho cac service tham gia luong hoi dap.
x-tracing-env: &tracing-env
  LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
  LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
  LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-legal-rag}
  LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
  LANGSMITH_TRACING_SAMPLING_RATE: ${LANGSMITH_TRACING_SAMPLING_RATE:-1}
  LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-false}
  LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-false}
  # Chi de ghi dung model vao metadata trace; llm-service doc model tu .env mount rieng.
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}

services:
  api-gateway:
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "true"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: rag-ttcsn:cpu
    command: ["uvicorn", "services.api_gateway.app:app", "--host", "0.0.0.0", "--port", "7860"]
    ports:
      - "7860:7860"
    environment:
      <<: *tracing-env
      VECTOR_SERVICE_URL: http://vector-rag-service:8001
      WIKI_SERVICE_URL: http://wiki-rag-service:8002
      EVALUATOR_SERVICE_URL: http://evaluator-service:8004
    depends_on:
      vector-rag-service:
        condition: service_healthy
      wiki-rag-service:
        condition: service_healthy
      evaluator-service:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    restart: unless-stopped

  vector-rag-service:
    image: rag-ttcsn:cpu
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "true"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["uvicorn", "services.vector_rag_service.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *tracing-env
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-sentence-transformers}
      EMBEDDING_PROFILE: ${EMBEDDING_PROFILE:-vietnamese}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_RUNTIME: ${EMBEDDING_RUNTIME:-onnx}
      RERANKER_DEVICE: ${RERANKER_DEVICE:-auto}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-4}
      PRELOAD_VECTOR_INDEX: ${PRELOAD_VECTOR_INDEX:-true}
      LLM_SERVICE_URL: http://llm-service:8003
    volumes:
      - ./data_raw:/app/data_raw:ro
      - vector_faiss_index:/app/faiss_index
      - vector_hybrid_index:/app/hybrid_index
      - model_cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/health | grep -q '\"status\":\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  wiki-rag-service:
    image: rag-ttcsn:cpu
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "true"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["uvicorn", "services.wiki_rag_service.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *tracing-env
      WIKI_DIR: /app/wiki_data/wiki
      PRELOAD_WIKI_CACHE: ${PRELOAD_WIKI_CACHE:-true}
      LLM_SERVICE_URL: http://llm-service:8003
    volumes:
      - ./wiki_data:/app/wiki_data:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  llm-service:
    image: rag-ttcsn:cpu
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "true"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["uvicorn", "services.llm_service.app:app", "--host", "0.0.0.0", "--port", "8003"]
    environment:
      <<: *tracing-env
    extra_hosts:
      - "host.docker.internal:host-gateway"  # proxy LLM chay tren host (DEEPSEEK_BASE_URL=http://host.docker.internal:...)
    volumes:
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8003/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  evaluator-service:
    image: rag-ttcsn:cpu
    build:
      context: .
      args:
        INSTALL_EMBEDDINGS: "true"
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["uvicorn", "services.evaluator_service.app:app", "--host", "0.0.0.0", "--port", "8004"]
    environment:
      EVAL_DB_PATH: /app/eval_data/eval.db
    volumes:
      - eval_data:/app/eval_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8004/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

volumes:
  vector_faiss_index:
  vector_hybrid_index:
  model_cache:
  eval_data:
